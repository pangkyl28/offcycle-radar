name: Scan off-cycle internships

on:
  schedule:
    # Twice daily: approximately 1:17 AM and 1:17 PM Central during CST.
    # GitHub schedules use UTC and may run late.
    - cron: '17 7,19 * * *'
  workflow_dispatch:
    inputs:
      notify_existing:
        description: 'Alert for current matches too (first run or reset only)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: offcycle-radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check listings and send notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NOTIFY_EXISTING: ${{ inputs.notify_existing || 'false' }}
        run: |
          if [ "$NOTIFY_EXISTING" = "true" ]; then
            python tracker.py scan --notify-existing
          else
            python tracker.py scan
          fi
      - name: Commit refreshed dashboard and seen-job state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/jobs.json data/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update internship radar results'
            git push
          fi
